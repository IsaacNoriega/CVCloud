name: Deploy Frontend

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "VITE_API_URL=http://${{ secrets.BACK_HOST }}:3000" > .env

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.FRONT_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "/home/ec2-user/frontend"
