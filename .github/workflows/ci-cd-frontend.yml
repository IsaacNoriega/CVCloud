name: CI/CD Frontend CloudProject

on:
  push:
    branches: [ "deploy-front" ]

env:
  # ECR_REGISTRY usa el secreto de AWS_ACCOUNT_ID para mayor flexibilidad
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_FRONTEND: cloudproject/frontend

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Frontend
        # Usamos working-directory: ./frontend, asumiendo que es la carpeta que contiene el Dockerfile
        working-directory: ./frontend 
        run: |
          # 1. Construir (inyectando la URL del backend)
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest .
          
          # 2. Subir a ECR
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # --- 1. PREPARACIÓN EN EL SERVIDOR (CRÍTICO) ---
            # Aseguramos que la carpeta exista ANTES de intentar entrar
            mkdir -p /home/ec2-user/CVCloud/frontend 
            cd /home/ec2-user/CVCloud/frontend
            
            # --- 2. CONFIGURACIÓN DE ACCESO AWS ---
            # Exportar credenciales temporales para el 'aws ecr get-login-password'
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            export AWS_REGION=us-east-1
            
            # --- 3. LOGUEAR Y DESPLEGAR ---
            echo "Iniciando login a ECR y reinicio de contenedores..."
            
            # Login a ECR (Ahora SÍ funcionará porque las credenciales están exportadas)
            aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
            
            # Bajar y reiniciar
            docker-compose pull
            docker-compose up -d --remove-orphans
            
            echo "Despliegue de Frontend completado."
            docker image prune -f