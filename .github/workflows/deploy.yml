name: Deploy Frontend

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Crear .env dentro de frontend
      - name: Create .env file
        run: |
          echo "VITE_API_URL=http://${{ secrets.BACK_HOST }}:3000" > frontend/.env
          echo "[OK] .env created"
          cat frontend/.env

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix frontend

      - name: Build project
        run: npm run build --prefix frontend

      - name: Debug folders
        run: ls -R frontend

      # Crear carpeta en EC2 si no existe
      - name: Prepare target folder on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.FRONT_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/frontend
            rm -rf /home/ec2-user/frontend/*

      # Subir el build usando rsync
      - name: Upload build to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.FRONT_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Files will be uploaded via rsync in next step"
      
      - name: Copy files via rsync
        run: |
          echo "${{ secrets.SSH_KEY }}" > private_key
          chmod 600 private_key
          rsync -avz -e "ssh -i private_key -o StrictHostKeyChecking=no" frontend/dist/ ec2-user@${{ secrets.FRONT_HOST }}:/home/ec2-user/frontend/
          rm -f private_key
